name: data-sensor-airflow

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_USERNAME}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: >-
      /opt/airflow/config/simple_auth_manager_passwords.json.generated

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: >-
      http://airflow-api-server:8080/execution/

    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}

    AIRFLOW_CONN_SENSOR_POSTGRES: >-
      postgresql://${SENSOR_DB_USER}:${SENSOR_DB_PASSWORD}@postgres:5432/${SENSOR_DB_NAME}

    PYTHONPATH: /opt/project

  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins:ro
    - ./config:/opt/airflow/config

    - ./database:/opt/project/database
    - ./controllers:/opt/project/controllers:ro
    - ./models:/opt/project/models:ro
    - ./config:/opt/project/config:ro
    - ./scripts:/opt/project/scripts:ro

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy


services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: "${POSTGRES_ADMIN_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_ADMIN_DB}"

      AIRFLOW_DB_USER: "${AIRFLOW_DB_USER}"
      AIRFLOW_DB_PASSWORD: "${AIRFLOW_DB_PASSWORD}"
      AIRFLOW_DB_NAME: "${AIRFLOW_DB_NAME}"

      SENSOR_DB_USER: "${SENSOR_DB_USER}"
      SENSOR_DB_PASSWORD: "${SENSOR_DB_PASSWORD}"
      SENSOR_DB_NAME: "${SENSOR_DB_NAME}"

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_ADMIN_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  mosquitto:
    image: eclipse-mosquitto:2

    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"

    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  airflow-init:
    <<: *airflow-common

    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow version

    restart: "no"


  airflow-api-server:
    <<: *airflow-common

    command: api-server

    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

    restart: unless-stopped


  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

    restart: unless-stopped


  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

    restart: unless-stopped


  sqlite-init:
    build:
      context: .
      dockerfile: Dockerfile.app

    command:
      - python
      - scripts/initSqlite.py

    environment:
      PYTHONPATH: /opt/project
      SQLITE_DATABASE: /opt/project/database/LocalData.db
      SQLITE_INIT_SQL: /opt/project/docker/sqlite/init.sql

    volumes:
      - ./scripts:/opt/project/scripts:ro
      - ./database:/opt/project/database
      - ./docker/sqlite/init.sql:/opt/project/docker/sqlite/init.sql:ro

    restart: "no"


  subscriber:
    build:
      context: .
      dockerfile: Dockerfile.app

    command:
      - python
      - scripts/SubscriberMqtt.py

    environment:
      PYTHONPATH: /opt/project
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SQLITE_DATABASE: /opt/project/database/LocalData.db

    volumes:
      - ./controllers:/opt/project/controllers:ro
      - ./models:/opt/project/models:ro
      - ./scripts:/opt/project/scripts:ro
      - ./database:/opt/project/database
      - ./config:/opt/project/config:ro

    depends_on:
      mosquitto:
        condition: service_healthy
      sqlite-init:
        condition: service_completed_successfully

    restart: unless-stopped


  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app

    command:
      - python
      - dashboard/DashInterface.py

    environment:
      PYTHONPATH: /opt/project

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "${SENSOR_DB_NAME}"
      POSTGRES_USER: "${SENSOR_DB_USER}"
      POSTGRES_PASSWORD: "${SENSOR_DB_PASSWORD}"

    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8050}:8050"

    volumes:
      - ./dashboard:/opt/project/dashboard:ro
      - ./controllers:/opt/project/controllers:ro
      - ./models:/opt/project/models:ro
      - ./config:/opt/project/config:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
